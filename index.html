<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trinity Goobers NBA Fantasy League</title>
<style>
  :root {
    --green: #0B4429;
    --gold: #FFC72C;
    --bg: #07140D;
    --panel: #0E2A1B;
    --line: #1F4A33;
    --text: #EDEDED;
    --muted: #A9BFB2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }
  header {
    background: var(--green);
    border-bottom: 3px solid var(--gold);
    padding: 14px 16px 0;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.02em;
    margin: 0 0 10px;
  }
  nav {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 10px;
    -webkit-overflow-scrolling: touch;
  }
  nav a {
    color: var(--text);
    text-decoration: none;
    font-size: 0.9rem;
    padding: 6px 12px;
    border-radius: 999px;
    white-space: nowrap;
    border: 1px solid var(--line);
  }
  nav a.active, nav a:hover {
    background: var(--gold);
    color: var(--green);
    border-color: var(--gold);
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 18px 14px 60px;
  }
  h1 { font-size: 1.5rem; color: var(--gold); margin: 0 0 6px; }
  h2 { font-size: 1.15rem; color: var(--gold); margin: 28px 0 8px; }
  h3 { font-size: 1rem; color: var(--text); margin: 18px 0 6px; }
  p.note { color: var(--muted); font-size: 0.85rem; margin: 6px 0 12px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .champ {
    display: flex;
    justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 1px solid var(--line);
  }
  .champ:last-child { border-bottom: none; }
  .champ .season { color: var(--gold); font-weight: 700; }
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 14px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
    background: var(--panel);
  }
  th, td {
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  th {
    background: var(--green);
    color: var(--gold);
    cursor: pointer;
    user-select: none;
    position: sticky;
    top: 0;
  }
  th .arrow { opacity: 0.6; font-size: 0.75rem; }
  tr:hover td { background: #133524; }
  td.num, th.num { text-align: right; }
  .tag {
    display: inline-block;
    font-size: 0.72rem;
    padding: 2px 7px;
    border-radius: 999px;
    margin-left: 6px;
    background: var(--gold);
    color: var(--green);
    font-weight: 700;
  }
  .tag.muted { background: var(--line); color: var(--text); }
  tr.row-champ td { background: #1B4A2F; }
  tr.row-gf td { background: #173F28; }
  tr.row-playoff td { background: #12331F; }
  tr.row-last td { color: #F7B5A8; }
  .toggle { margin: 6px 0 12px; }
  .toggle button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    margin-right: 6px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .toggle button.on { background: var(--gold); color: var(--green); border-color: var(--gold); }
  .search {
    width: 100%;
    padding: 10px 12px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 1rem;
    margin-bottom: 12px;
  }
  @media (min-width: 720px) {
    .brand { font-size: 1.5rem; }
    h1 { font-size: 1.9rem; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">Trinity Goobers NBA Fantasy League</div>
  <nav id="nav">
    <a href="#home">Home</a>
    <a href="#seasons">Seasons</a>
    <a href="#people">Managers</a>
    
    <a href="#draft">Draft</a>
    <a href="#finals">Finals</a>
    <a href="#trades">Trades</a>
    <a href="#adds">Adds</a>
    <a href="#records">Category Records</a>
       <a href="#champions">Championship Teams</a> <a href="#fame">Hall of Fame</a> <a href="#shame">Hall of Shame</a>
  </nav>
</header>
<main id="app"><p class="note">Loading…</p></main>
<script src="unlock.js"></script>
</body>
</html>
